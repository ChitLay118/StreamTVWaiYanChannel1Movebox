<!DOCTYPE html>

    <title>Myanmar Live TV & FM Player</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- HLS.js for Streaming Video .m3u8 support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Audio Visualizer Animation */
        @keyframes soundWave {
            0%, 100% { height: 6px; }
            50% { height: 28px; }
        }
        .wave-bar {
            animation: soundWave 1.2s ease-in-out infinite;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .wave-bar:nth-child(4) { animation-delay: 0.1s; }
        .wave-bar:nth-child(5) { animation-delay: 0.5s; }

        /* Vinyl Record Spinning Animation */
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 12s linear infinite;
        }
    </style>
</head>

            },
            { 
                id: 'fm-padamyar', 
                name: 'Padamyar FM', 
                category: 'myanmar-fm', 
                isRadio: true, 
                logo: 'https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?w=150', 
                streamUrl: 'https://stream.zeno.fm/u74v344y87zuv',
                backupUrl: 'https://stream.zeno.fm/f3wvbb3387zuv'
            },
            { 
                id: 'fm-bbc-world', 
                name: 'BBC World Service Radio', 
                category: 'myanmar-fm', 
                isRadio: true, 
                logo: 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=150', 
                streamUrl: 'https://as-hls-ww-live.akamaized.net/pool_87948813/live/ww/bbc_world_service/bbc_world_service.isml/bbc_world_service-audio%3d96000.norewind.m3u8',
                backupUrl: 'https://stream.live.vc.bbcmedia.co.uk/bbc_world_service'
            },
            { 
                id: 'fm-voa', 
                name: 'VOA Burmese Radio', 
                category: 'myanmar-fm', 
                isRadio: true, 
                logo: 'https://images.unsplash.com/photo-1593784991095-a205069470b6?w=150', 
                streamUrl: 'https://voa-28.akacast.akamaized.net/7/776/410189/v1/ibb.akacast.akamaized.net/voa-28',
                backupUrl: 'https://stream.zeno.fm/rfaburmese'
            }
        ];

        let allChannels = [...defaultFMChannels];
        let favorites = JSON.parse(localStorage.getItem('mm_tv_favs') || '[]');
        let activeNavTab = 'home'; // 'home', 'channel', 'fm', 'favorites'
        let channelSubFilter = 'channel'; // 'channel', 'esports', 'movieaction'
        let searchQuery = '';
        let currentPlayingId = null;
        let hlsInstance = null;

        // Fetch dynamic channel JSONs from GitHub raw links
        async function fetchExternalJsonData() {
            const jsonSources = {
                channel: 'https://raw.githubusercontent.com/ChitLay118/StreamTVWaiYanChannel1Movebox/refs/heads/main/MyChannel.json',
                esports: 'https://raw.githubusercontent.com/ChitLay118/StreamTVWaiYanChannel1Movebox/refs/heads/main/Esportschannel.json',
                movieaction: 'https://raw.githubusercontent.com/ChitLay118/StreamTVWaiYanChannel1Movebox/refs/heads/main/MovieAction.json'
            };

            let fetchedTvChannels = [];

            for (const [categoryKey, url] of Object.entries(jsonSources)) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) continue;
                    
                    const remoteData = await response.json();
                    const list = Array.isArray(remoteData) ? remoteData : (remoteData.channels || remoteData.items || remoteData.data || []);

                    list.forEach((item, index) => {
                        const stream = item.src || item.streamUrl || item.url || item.link;
                        if (stream) {
                            fetchedTvChannels.push({
                                id: `github-${categoryKey}-${index}-${Math.random().toString(36).substr(2, 5)}`,
                                name: item.title || item.name || `${categoryKey.toUpperCase()} Channel ${index + 1}`,
                                category: categoryKey,
                                isRadio: false,
                                logo: item.thumb || item.logo || item.image || 'https://images.unsplash.com/photo-1593784991095-a205069470b6?w=150',
                                streamUrl: stream
                            });
                        }
                    });
                } catch (error) {
                    console.warn(`Error fetching ${categoryKey} JSON:`, error);
                }
            }

            if (fetchedTvChannels.length > 0) {
                allChannels = [...defaultFMChannels, ...fetchedTvChannels];
            } else {
                // Fallback demo channels if fetch is completely offline
                allChannels = [
                    ...defaultFMChannels,
                    { id: 'ch-mrtv4', name: 'MRTV-4 Live', category: 'channel', isRadio: false, logo: 'https://images.unsplash.com/photo-1593784991095-a205069470b6?w=150', streamUrl: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
                    { id: 'ch-channel7', name: 'Channel 7', category: 'channel', isRadio: false, logo: 'https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=150', streamUrl: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' }
                ];
            }
            renderChannels();
        }

        function playChannel(channelId) {
            const item = allChannels.find(c => c.id === channelId);
            if (!item) return;

            currentPlayingId = channelId;
            const videoPlayer = document.getElementById('videoPlayer');
            const audioPlayer = document.getElementById('audioPlayer');
            const placeholder = document.getElementById('playerPlaceholder');
            const videoContainer = document.getElementById('videoContainer');
            const audioContainer = document.getElementById('audioContainer');
            const titleEl = document.getElementById('currentChannelTitle');
            const badgeEl = document.getElementById('playerTypeBadge');
            const liveBadge = document.getElementById('liveBadge');
            const vinylDisk = document.getElementById('vinylDisk');
            const equalizerBars = document.getElementById('equalizerBars');
            const radioLogoImg = document.getElementById('radioLogoImg');

            placeholder.classList.add('hidden');
            liveBadge.classList.remove('hidden');
            titleEl.innerText = item.name;

            // Stop existing playback streams
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            videoPlayer.pause();
            audioPlayer.pause();

            if (item.isRadio || item.category === 'myanmar-fm') {
                // Radio Stream Mode
                videoContainer.classList.add('hidden');
                audioContainer.classList.remove('hidden');
                badgeEl.innerText = 'MYANMAR FM';
                radioLogoImg.src = item.logo;

                const primaryUrl = item.streamUrl;
                const backupUrl = item.backupUrl;

                // Support both HLS audio (.m3u8) and direct audio streams
                if (primaryUrl.includes('.m3u8') && Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(primaryUrl);
                    hlsInstance.attachMedia(audioPlayer);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                        audioPlayer.play().then(() => {
                            vinylDisk.classList.add('animate-spin-slow');
                            equalizerBars.classList.remove('opacity-40');
                        }).catch(e => console.log('Audio autoplay prevented:', e));
                    });
                    hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal && backupUrl) {
                            audioPlayer.src = backupUrl;
                            audioPlayer.play().catch(e => console.log('Backup playback error:', e));
                        }
                    });
                } else {
                    audioPlayer.src = primaryUrl;
                    audioPlayer.load();

                    const playPromise = audioPlayer.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            vinylDisk.classList.add('animate-spin-slow');
                            equalizerBars.classList.remove('opacity-40');
                        }).catch(err => {
                            console.warn('Primary audio stream failed, trying backup:', err);
                            if (backupUrl) {
                                audioPlayer.src = backupUrl;
                                audioPlayer.load();
                                audioPlayer.play().catch(e => {
                                    showToast(`${item.name} ကို ချိတ်ဆက်၍မရပါ`);
                                });
                            } else {
                                showToast(`${item.name} ကို ချိတ်ဆက်၍မရပါ`);
                            }
                        });
                    }
                }

                audioPlayer.onplay = () => {
                    vinylDisk.classList.add('animate-spin-slow');
                    equalizerBars.classList.remove('opacity-40');
                };
                audioPlayer.onpause = () => {
                    vinylDisk.classList.remove('animate-spin-slow');
                    equalizerBars.classList.add('opacity-40');
                };
                audioPlayer.onerror = () => {
                    if (backupUrl && audioPlayer.src !== backupUrl) {
                        audioPlayer.src = backupUrl;
                        audioPlayer.play().catch(() => showToast('လိုင်းဖွင့်ရာတွင် အမှားအယွင်းရှိပါသည်'));
                    } else {
                        showToast('လိုင်းဖွင့်ရာတွင် အမှားအယွင်းရှိပါသည်');
                    }
                };
            } else {
                // TV / Video Stream Mode
                audioContainer.classList.add('hidden');
                videoContainer.classList.remove('hidden');
                badgeEl.innerText = item.category.toUpperCase();

                const streamUrl = item.streamUrl || 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';

                if (streamUrl.includes('.m3u8') && Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(streamUrl);
                    hlsInstance.attachMedia(videoPlayer);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                        videoPlayer.play().catch(e => console.log('Autoplay prevented:', e));
                    });
                    hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            showToast('Video Stream အား ဖွင့်၍မရပါ');
                        }
                    });
                } else {
                    videoPlayer.src = streamUrl;
                    videoPlayer.play().catch(e => console.log('Autoplay prevented:', e));
                }
            }

            showToast(`${item.name} ကိုဖွင့်နေသည်`);
            renderChannels();
        }

        function renderChannels() {
            const grid = document.getElementById('channelGrid');
            const emptyState = document.getElementById('emptyState');
            const countBadge = document.getElementById('channelCountBadge');
            const filterContainer = document.getElementById('categoryFilterContainer');

            // Category filter visibility: Strictly ONLY shown when active tab is 'channel'
            if (activeNavTab === 'channel') {
                filterContainer.classList.remove('hidden');
                filterContainer.classList.add('flex');
            } else {
                filterContainer.classList.add('hidden');
                filterContainer.classList.remove('flex');
            }

            let filtered = allChannels.filter(c => {
                let matchesCategory = true;

                if (activeNavTab === 'home') {
                    matchesCategory = !c.isRadio; // All TV / Video channels
                } else if (activeNavTab === 'channel') {
                    matchesCategory = (c.category === channelSubFilter) && !c.isRadio;
                } else if (activeNavTab === 'fm') {
                    matchesCategory = c.isRadio || c.category === 'myanmar-fm';
                } else if (activeNavTab === 'favorites') {
                    matchesCategory = favorites.includes(c.id);
                }

                let matchesSearch = c.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            countBadge.innerText = filtered.length;

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            grid.innerHTML = filtered.map(c => {
                const isFav = favorites.includes(c.id);
                const isPlaying = c.id === currentPlayingId;

                return `
                    <div onclick="playChannel('${c.id}')" 
                         class="group relative bg-slate-900/90 hover:bg-slate-800/90 border ${isPlaying ? 'border-purple-500 shadow-purple-900/20' : 'border-slate-800/80'} rounded-2xl p-3 flex flex-col items-center justify-between cursor-pointer transition-all duration-200 active:scale-95 shadow-md">
                        
                        <button onclick="event.stopPropagation(); toggleFavorite('${c.id}')" 
                                class="absolute top-2 right-2 p-1.5 text-slate-500 hover:text-rose-500 transition z-10">
                            <i class="${isFav ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart'} text-xs"></i>
                        </button>

                        <div class="relative w-14 h-14 rounded-xl overflow-hidden my-1 bg-slate-950 flex items-center justify-center border border-slate-800 group-hover:border-purple-500/50 transition">
                            <img src="${c.logo}" alt="${c.name}" onerror="this.src='https://images.unsplash.com/photo-1593784991095-a205069470b6?w=150'" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-purple-600/30 ${isPlaying ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'} flex items-center justify-center transition backdrop-blur-[1px]">
                                <i class="fa-solid ${isPlaying ? 'fa-chart-simple text-purple-300 animate-pulse' : 'fa-circle-play text-white'} text-xl drop-shadow-md"></i>
                            </div>
                        </div>

                        <div class="text-center w-full mt-1">
                            <p class="text-xs font-semibold text-slate-200 truncate group-hover:text-purple-300 transition">${c.name}</p>
                            <span class="text-[10px] text-slate-400 capitalize inline-block mt-0.5">${c.isRadio ? 'Radio Stream' : c.category}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setActiveNav(nav) {
            activeNavTab = nav;
            const tabs = ['home', 'channel', 'fm', 'favorites'];
            
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    if (t === nav) {
                        btn.className = "flex flex-col items-center justify-center py-1 px-3 text-purple-400 transition-colors";
                    } else {
                        btn.className = "flex flex-col items-center justify-center py-1 px-3 text-slate-500 hover:text-slate-300 transition-colors";
                    }
                }
            });

            renderChannels();
        }

        function setChannelSubFilter(subCategory) {
            channelSubFilter = subCategory;
            ['channel', 'esports', 'movieaction'].forEach(cat => {
                const btn = document.getElementById(`subfilter-${cat}`);
                if (btn) {
                    if (cat === subCategory) {
                        btn.className = "filter-pill px-4 py-2 rounded-xl bg-purple-600 text-white font-medium shadow-md shadow-purple-600/30 border border-purple-500/50 whitespace-nowrap transition";
                    } else {
                        btn.className = "filter-pill px-4 py-2 rounded-xl bg-slate-900 text-slate-400 font-medium hover:text-slate-200 border border-slate-800 whitespace-nowrap transition";
                    }
                }
            });
            renderChannels();
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
                showToast('Favorites မှ ဖယ်ထုတ်ပြီးပါပြီ');
            } else {
                favorites.push(id);
                showToast('Favorites ထဲသို့ ထည့်ပြီးပါပြီ');
            }
            localStorage.setItem('mm_tv_favs', JSON.stringify(favorites));
            renderChannels();
        }

        function onSearchChange(val) {
            searchQuery = val.trim();
            const clearBtn = document.getElementById('clearSearchBtn');
            if (searchQuery.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderChannels();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderChannels();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2000);
        }

        // App Initialization
        window.addEventListener('DOMContentLoaded', () => {
            fetchExternalJsonData();
        });
    </script>
</body>
</html>
